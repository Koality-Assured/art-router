<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Art Router Banner</title>
  <desc id="bannerDesc">Official hero banner for Art Router showcasing multi-modal creative routing, request contracts, and evidence validation.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="45%" stop-color="#0D1424"/>
      <stop offset="100%" stop-color="#090D18"/>
    </linearGradient>

    <!-- Spectrum Text & Accent Gradients -->
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="35%" stop-color="#A855F7"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <linearGradient id="cyanVioletGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="violetMagentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="badgeBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="bottomBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="35%" stop-color="#8B5CF6"/>
      <stop offset="70%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="bannerGlowRight" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.28"/>
      <stop offset="40%" stop-color="#06B6D4" stop-opacity="0.14"/>
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bannerGlowLeft" cx="20%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="bannerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background Canvas -->
  <rect width="1200" height="360" fill="url(#bannerBg)"/>

  <!-- Ambient Lighting Glows -->
  <rect width="1200" height="360" fill="url(#bannerGlowRight)"/>
  <rect width="1200" height="360" fill="url(#bannerGlowLeft)"/>

  <!-- Decorative Blueprint Grid Matrix (Subtle) -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="440" y1="0" x2="440" y2="360"/>
    <line x1="560" y1="0" x2="560" y2="360"/>
    <line x1="680" y1="0" x2="680" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="920" y1="0" x2="920" y2="360"/>
    <line x1="1040" y1="0" x2="1040" y2="360"/>
    <line x1="1160" y1="0" x2="1160" y2="360"/>

    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Dynamic Routing Streamlines across Banner -->
  <path d="M 0,220 C 350,160 520,320 860,180 C 1020,110 1120,170 1200,140" 
        fill="none" stroke="url(#cyanVioletGrad)" stroke-width="2" stroke-opacity="0.45" stroke-dasharray="6,8"/>

  <path d="M 0,260 C 400,320 620,120 900,240 C 1040,300 1130,220 1200,260" 
        fill="none" stroke="url(#violetMagentaGrad)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- ================= RIGHT HERO GRAPHIC: THE ROUTING NEXUS ================= -->
  <g transform="translate(940, 180)">
    <!-- Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#475569" stroke-opacity="0.25" stroke-width="1.2" stroke-dasharray="6,8"/>
    <circle cx="0" cy="0" r="105" fill="none" stroke="#64748B" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="68" fill="none" stroke="#94A3B8" stroke-opacity="0.25" stroke-width="1"/>

    <!-- Central Routing Prism ('A' Emblem) -->
    <polygon points="0,-64 72,60 -72,60" fill="none" stroke="url(#brandGradient)" stroke-width="2" stroke-opacity="0.5"/>
    <path d="M 0,-56 L -58,52 L -20,52 L 0,6 Z" fill="url(#cyanVioletGrad)" filter="url(#softBlur)"/>
    <path d="M 0,-56 L 58,52 L 20,52 L 0,6 Z" fill="url(#violetMagentaGrad)" filter="url(#softBlur)"/>
    <polygon points="0,-56 -18,-6 0,16 18,-6" fill="#FFFFFF" fill-opacity="0.85"/>
    <polygon points="0,2 16,28 0,54 -16,28" fill="#0F172A" stroke="url(#brandGradient)" stroke-width="2"/>
    <polygon points="0,12 8,28 0,44 -8,28" fill="#F59E0B" filter="url(#softBlur)"/>

    <!-- Satellite Modality Nodes -->
    <!-- Node 1: Raster/Canvas (Top Right) -->
    <g transform="translate(95, -60)" filter="url(#bannerGlow)">
      <line x1="-30" y1="20" x2="0" y2="0" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="#0F172A" stroke="#EC4899" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#F43F5E"/>
    </g>

    <!-- Node 2: Vector/Geometry (Top Center) -->
    <g transform="translate(0, -105)" filter="url(#bannerGlow)">
      <circle cx="0" cy="0" r="9" fill="#0F172A" stroke="#22D3EE" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF"/>
    </g>

    <!-- Node 3: 3D/CGI (Bottom Right) -->
    <g transform="translate(100, 65)" filter="url(#bannerGlow)">
      <line x1="-30" y1="-15" x2="0" y2="0" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="#0F172A" stroke="#8B5CF6" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#C084FC"/>
    </g>

    <!-- Node 4: Motion/Video (Bottom Left) -->
    <g transform="translate(-105, 55)" filter="url(#bannerGlow)">
      <line x1="30" y1="-15" x2="0" y2="0" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="8" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
    </g>

    <!-- Node 5: Audio/Haptic (Top Left) -->
    <g transform="translate(-95, -65)" filter="url(#bannerGlow)">
      <line x1="30" y1="20" x2="0" y2="0" stroke="#F59E0B" stroke-opacity="0.5" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="7" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
      <circle cx="0" cy="0" r="2.5" fill="#FDE047"/>
    </g>

    <!-- Node 6: Spatial XR (Bottom Center) -->
    <g transform="translate(0, 105)" filter="url(#bannerGlow)">
      <circle cx="0" cy="0" r="7" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
      <circle cx="0" cy="0" r="2.5" fill="#34D399"/>
    </g>

    <!-- Vector Anchor Handles Illustration -->
    <g opacity="0.8">
      <line x1="-70" y1="-10" x2="-20" y2="-45" stroke="#38BDF8" stroke-width="1.2" stroke-dasharray="2,2"/>
      <circle cx="-70" cy="-10" r="3.5" fill="#080C14" stroke="#38BDF8" stroke-width="1.5"/>
      <circle cx="-20" cy="-45" r="3.5" fill="#38BDF8"/>
    </g>
  </g>

  <!-- ================= LEFT HERO TEXT: TYPOGRAPHIC BRAND BLOCK ================= -->
  <!-- Category Pill / Overline Badge -->
  <g transform="translate(80, 52)">
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0F172A" stroke="url(#badgeBorder)" stroke-width="1.2"/>
    <circle cx="16" cy="14" r="4.5" fill="#22D3EE" filter="url(#softBlur)"/>
    <text x="30" y="19" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="2">KOALITY-ASSURED DOMAIN ROUTER</text>
  </g>

  <!-- Main Hero Title -->
  <g transform="translate(80, 138)">
    <text x="0" y="0" fill="url(#brandGradient)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="900" letter-spacing="-1.5">
      ART ROUTER
    </text>
  </g>

  <!-- Subtitle / Pitch -->
  <g transform="translate(80, 182)">
    <text x="0" y="0" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" letter-spacing="-0.2">
      Intelligent Creative Routing &amp; Autonomous Synthesis Engine
    </text>
    <text x="0" y="28" fill="#94A3B8" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Multi-modal art dispatch across 22+ representation media with strict request contracts &amp; evidence validation.
    </text>
  </g>

  <!-- Capability Feature Chips -->
  <g transform="translate(80, 252)">
    <!-- Chip 1: 22+ Routes -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="168" height="32" rx="6" fill="#131D31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#22D3EE"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">22+ Representation Routes</text>
    </g>

    <!-- Chip 2: Contract Preservation -->
    <g transform="translate(178, 0)">
      <rect x="0" y="0" width="162" height="32" rx="6" fill="#131D31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#A855F7"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero-Drift Contracts</text>
    </g>

    <!-- Chip 3: Dual Specialist Architecture -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="170" height="32" rx="6" fill="#131D31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#EC4899"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Dual-Agent Specialist Hub</text>
    </g>

    <!-- Chip 4: Evidence & Fixity -->
    <g transform="translate(530, 0)">
      <rect x="0" y="0" width="158" height="32" rx="6" fill="#131D31" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="16" r="3.5" fill="#F59E0B"/>
      <text x="28" y="20" fill="#E2E8F0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Automated Validation</text>
    </g>
  </g>

  <!-- Sleek Bottom Multi-Stop Gradient Accent Line -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#bottomBorder)"/>
</svg>
