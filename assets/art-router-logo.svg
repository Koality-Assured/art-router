<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Art Router Logo</title>
  <desc id="logoDesc">Geometric prism emblem combining neural routing paths and artistic media nodes on an obsidian canvas.</desc>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0A0E1A"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#8B5CF6" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Spectrum Core Gradients -->
    <linearGradient id="cyanToIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>

    <linearGradient id="violetToMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#D946EF"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <linearGradient id="prismLight" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#FDF2F8" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="goldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#06B6D4" stop-opacity="0.15"/>
      <stop offset="80%" stop-color="#EC4899" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#080C14" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="coreSpot" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#E879F9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Canvas Background Card -->
  <rect x="12" y="12" width="488" height="488" rx="108" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="108" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Subtle Inner Framing -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="#334155" stroke-opacity="0.25" stroke-width="1"/>

  <!-- Ambient Radial Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#ambientGlow)"/>

  <!-- Subtle Background Constellation Rings / Orbitals -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#475569" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="6,8"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="#64748B" stroke-opacity="0.15" stroke-width="1" stroke-dasharray="3,6"/>
  <circle cx="256" cy="256" r="80" fill="none" stroke="#94A3B8" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Radial Guide Rays -->
  <line x1="256" y1="60" x2="256" y2="100" stroke="#06B6D4" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="256" y1="412" x2="256" y2="452" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="60" y1="256" x2="100" y2="256" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="412" y1="256" x2="452" y2="256" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Curved Routing Waves / Multi-Representation Flow Lines -->
  <!-- Upper flowing bezier: Raster to Vector stream -->
  <path d="M 80,310 C 140,370 210,380 256,330 C 310,270 380,260 432,290" 
        fill="none" stroke="#EC4899" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round"/>

  <!-- Main Dynamic Routing Ribbon 1 (Cyan / Teal) -->
  <path d="M 90,190 C 160,140 220,180 256,240 C 295,305 365,340 430,220" 
        fill="none" stroke="url(#cyanToIndigo)" stroke-width="4.5" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Main Dynamic Routing Ribbon 2 (Violet / Magenta) -->
  <path d="M 95,240 C 150,300 210,310 256,256 C 300,200 360,170 425,185" 
        fill="none" stroke="url(#violetToMagenta)" stroke-width="4" stroke-linecap="round" filter="url(#softGlow)"/>

  <!-- Central Architectural Prism / Router Nexus ('A' Geometry) -->
  <!-- Outer Prism Triangle Glow -->
  <polygon points="256,92 396,364 116,364" fill="none" stroke="url(#borderGrad)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Left Facet of Art Prism (Cyan -> Indigo) -->
  <path d="M 256,104 L 140,352 L 214,352 L 256,260 Z" 
        fill="url(#cyanToIndigo)" filter="url(#softGlow)"/>

  <!-- Right Facet of Art Prism (Violet -> Magenta) -->
  <path d="M 256,104 L 372,352 L 298,352 L 256,260 Z" 
        fill="url(#violetToMagenta)" filter="url(#softGlow)"/>

  <!-- Apex Refraction Cap / Prism Core Face -->
  <polygon points="256,104 220,200 256,240 292,200" 
           fill="url(#prismLight)"/>

  <!-- Center Floating Router Core Diamond -->
  <polygon points="256,220 288,272 256,324 224,272" 
           fill="#0F172A" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Inner Radiant Jewel inside Diamond -->
  <polygon points="256,236 276,272 256,308 236,272" 
           fill="url(#goldAmber)" filter="url(#softGlow)"/>

  <!-- Vector Pen Tool Bezier Tangent Handle Demo (Precision Craftsmanship) -->
  <g opacity="0.85">
    <line x1="190" y1="180" x2="270" y2="135" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="3,3"/>
    <circle cx="190" cy="180" r="4.5" fill="#080C14" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="270" cy="135" r="4.5" fill="#38BDF8"/>
  </g>

  <!-- Network Node Satellites (Representing 6 Key Art Modalities) -->
  <!-- Node 1: Raster / Canvas (Magenta) -->
  <g transform="translate(116, 352)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="9" fill="#0F172A" stroke="#F43F5E" stroke-width="3"/>
    <circle cx="0" cy="0" r="3.5" fill="#F43F5E"/>
  </g>

  <!-- Node 2: Vector / Geometry (Cyan) -->
  <g transform="translate(256, 104)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="11" fill="#0F172A" stroke="#22D3EE" stroke-width="3.5"/>
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Node 3: 3D / CGI (Violet) -->
  <g transform="translate(372, 352)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="9" fill="#0F172A" stroke="#A855F7" stroke-width="3"/>
    <circle cx="0" cy="0" r="3.5" fill="#D946EF"/>
  </g>

  <!-- Node 4: Motion / Animation (Sky Blue) -->
  <g transform="translate(425, 185)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="7.5" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#38BDF8"/>
  </g>

  <!-- Node 5: Audio / Haptic (Amber) -->
  <g transform="translate(90, 190)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="7.5" fill="#0F172A" stroke="#F59E0B" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="3" fill="#FDE047"/>
  </g>

  <!-- Node 6: Spatial XR / Interactive (Emerald) -->
  <g transform="translate(256, 436)" filter="url(#glowEffect)">
    <circle cx="0" cy="0" r="6" fill="#0F172A" stroke="#10B981" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#34D399"/>
  </g>

  <!-- Central Light Flash Sparkle -->
  <path d="M 256,260 L 258,269 L 267,272 L 258,275 L 256,284 L 254,275 L 245,272 L 254,269 Z" 
        fill="#FFFFFF" opacity="0.95"/>
</svg>
