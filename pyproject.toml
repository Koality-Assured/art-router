[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "koality-art-router"
version = "1.0.0"
description = "Domain AI harness router for multi-modal artistic generation, vector craftsmanship, and governed creative synthesis."
authors = [{ name = "Koality-Assured", email = "engineering@koality-assured.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "cryptography>=41.0",
]

[tool.setuptools]
packages = []
